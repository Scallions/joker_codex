<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <rect width="1400" height="760" fill="#080b20"/>
  <text x="50" y="54" fill="#f8df9b" font-size="30" font-weight="700" font-family="system-ui, sans-serif">UX-003 · 教程专用谢幕（结构草图）</text>
  <text x="50" y="84" fill="#b7b9ca" font-size="16" font-family="system-ui, sans-serif">教程成功应总结已学会的动作，而不是套用普通局结算口径。</text>
  <g transform="translate(40 112)">
    <rect width="640" height="600" rx="12" fill="#11152c" stroke="#66543a" stroke-width="2"/>
    <text x="24" y="40" fill="#c9cad5" font-size="22" font-weight="700" font-family="system-ui, sans-serif">现在</text>
    <text x="320" y="116" text-anchor="middle" fill="#f7e6b5" font-size="32" font-family="serif">今夜压轴，满堂喝彩</text>
    <g fill="#10172d" stroke="#66543a">
      <rect x="60" y="154" width="130" height="82"/><rect x="190" y="154" width="130" height="82"/>
      <rect x="320" y="154" width="130" height="82"/><rect x="450" y="154" width="130" height="82"/>
    </g>
    <g text-anchor="middle" font-family="system-ui, sans-serif">
      <text x="125" y="181" fill="#aaa" font-size="14">最终得分</text><text x="125" y="216" fill="#ff6b6b" font-size="25">0</text>
      <text x="255" y="181" fill="#aaa" font-size="14">目标</text><text x="255" y="216" fill="#f4e8bd" font-size="25">0</text>
      <text x="385" y="181" fill="#aaa" font-size="14">剩余出牌</text><text x="385" y="216" fill="#f4e8bd" font-size="25">0</text>
      <text x="515" y="181" fill="#aaa" font-size="14">戏票</text><text x="515" y="216" fill="#f4e8bd" font-size="25">¥32</text>
      <text x="320" y="278" fill="#f4e8bd" font-size="18">最后一手：两对 +116</text>
    </g>
    <rect x="80" y="314" width="480" height="80" fill="#10172d" stroke="#66543a"/>
    <text x="320" y="344" text-anchor="middle" fill="#f4e8bd" font-size="18" font-family="system-ui, sans-serif">本局永久进度</text>
    <text x="320" y="373" text-anchor="middle" fill="#a8a8b4" font-size="14" font-family="system-ui, sans-serif">此模式不改变普通解锁、收藏、成就与统计。</text>
    <text x="320" y="455" text-anchor="middle" fill="#ff9c91" font-size="16" font-family="system-ui, sans-serif">普通局字段在教程里变成矛盾噪声</text>
  </g>
  <g transform="translate(720 112)">
    <rect width="640" height="600" rx="12" fill="#11152c" stroke="#d5aa50" stroke-width="3"/>
    <text x="24" y="40" fill="#f8df9b" font-size="22" font-weight="700" font-family="system-ui, sans-serif">建议</text>
    <text x="320" y="114" text-anchor="middle" fill="#f7e6b5" font-size="34" font-family="serif">八步入门 · 全部完成</text>
    <rect x="78" y="145" width="484" height="64" rx="32" fill="#1d624f" stroke="#75c0a7" stroke-width="2"/>
    <text x="320" y="185" text-anchor="middle" fill="#fff" font-size="25" font-weight="700" font-family="system-ui, sans-serif">8 / 8  ✓</text>
    <text x="80" y="252" fill="#f8df9b" font-size="18" font-weight="700" font-family="system-ui, sans-serif">你已经学会</text>
    <g fill="#10172d" stroke="#66543a">
      <rect x="80" y="272" width="226" height="64"/><rect x="334" y="272" width="226" height="64"/>
      <rect x="80" y="352" width="226" height="64"/><rect x="334" y="352" width="226" height="64"/>
    </g>
    <g fill="#f4e8bd" font-size="17" font-family="system-ui, sans-serif">
      <text x="105" y="311">选牌 · 出牌 · 弃牌</text><text x="359" y="311">看计分与盲注目标</text>
      <text x="105" y="391">购买奇牌与补充包</text><text x="359" y="391">使用消耗牌并选目标</text>
    </g>
    <rect x="190" y="465" width="260" height="58" rx="5" fill="#b7303b"/>
    <text x="320" y="502" text-anchor="middle" fill="#fff" font-size="20" font-weight="700" font-family="system-ui, sans-serif">返回主菜单</text>
    <text x="320" y="558" text-anchor="middle" fill="#b7b9ca" font-size="14" font-family="system-ui, sans-serif">教程不会写入普通局进度</text>
  </g>
</svg>
