    <text x="564" y="527" text-anchor="middle" fill="#fff" font-size="16" font-family="system-ui, sans-serif">弃牌</text>
    <path d="M115 475 C230 400, 400 400, 528 430" fill="none" stroke="#ff7d73" stroke-width="4" stroke-dasharray="9 7"/>
